read:
  - AGENTS.md
  - repomix.config.json

mcp_servers:
  codegraph:
    command: "/Users/igmarin/.local/bin/codegraph"
    args:
      - serve
      - --mcp
      - --path
      - "/Volumes/minimini/Developer/Projects/rails-agent-skills"
  graphify:
    command: "/Users/igmarin/.local/bin/graphify-mcp"
    args:
      - --graph
      - "/Volumes/minimini/Developer/Projects/rails-agent-skills/graphify-out/graph.json"
  repomix:
    command: "/opt/homebrew/bin/repomix"
    args:
      - --mcp
      - --sandbox
      - "/Volumes/minimini/Developer/Projects/rails-agent-skills"
